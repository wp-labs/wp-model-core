[package]
name = "wp-model-core"
version = "0.7.0"
edition = "2024"

[lib]
name = "wp_model_core"
[dependencies]
smol_str = { version = "0.3", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_derive = "1"
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
ipnet = "2.11"
thiserror = "2"
wildmatch = "2.6"
smallvec = { version = "1.13", features = ["serde"] }
